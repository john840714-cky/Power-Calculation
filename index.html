    // --- 獨立的附件參考資料元件 (全新排版) ---
    const ReferenceAttachment = () => (
      <div className="space-y-6 print:space-y-4">
        {/* Header Title */}

        {/* 貳、表一 */}

            <li>依據管線種類（架空線路 / 地下管線）及電壓等級計收。</li>
            <li>新(添)建線路長度自電源端計，超出基本長度者，超出部分始依管線類型按表列單價計收超長費用。</li>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 print:block print:space-y-4">

          <section className="bg-purple-50 rounded-2xl shadow-sm border border-purple-100 border-l-4 border-l-purple-500 p-6 print:bg-white print:shadow-none print:border-gray-300 print:border-l-4 print:break-inside-avoid">
            <h4 className="font-bold text-purple-900 flex items-center text-lg mb-5 print:text-gray-800">

              肆、圖面解析：收費說明與作業流程
            </h4>
            
            {/* 模擬圖面視覺的流程圖 */}
            <div className="bg-white p-5 rounded-xl border-2 border-dashed border-purple-200 shadow-sm mb-5 print:border-gray-400 print:border-solid">
              <div className="flex flex-col md:flex-row items-center justify-between w-full gap-2 relative">
                
                <div className="flex-1 w-full bg-gray-50 border border-gray-300 rounded-lg py-2 px-1 text-center shadow-sm">
                  <span className="font-bold text-gray-700 text-sm">掛件</span>
                </div>
                <div className="text-purple-400 font-bold rotate-90 md:rotate-0 print:text-gray-400">➔</div>
                
                <div className="flex-1 w-full bg-gray-50 border border-gray-300 rounded-lg py-2 px-1 text-center shadow-sm">

                <div className="flex-1 w-full bg-blue-50 border-2 border-blue-400 rounded-lg py-2 px-1 text-center shadow-sm print:border-gray-500">

                </div>
                <div className="text-purple-400 font-bold rotate-90 md:rotate-0 print:text-gray-400">➔</div>
                
                <div className="flex-1 w-full bg-yellow-50 border-2 border-yellow-400 rounded-lg py-2 px-1 text-center shadow-md transform md:scale-110 md:mx-1 print:border-gray-600 print:scale-100 print:mx-0">
                  <span className="font-bold text-yellow-900 text-sm print:text-black">核費/繳費</span>
                </div>
                <div className="text-purple-400 font-bold rotate-90 md:rotate-0 print:text-gray-400">➔</div>
                
                <div className="flex-1 w-full bg-gray-50 border border-gray-300 rounded-lg py-2 px-1 text-center shadow-sm">
                  <span className="font-bold text-gray-700 text-sm">請路證</span>
                </div>
                <div className="text-purple-400 font-bold rotate-90 md:rotate-0 print:text-gray-400">➔</div>
                
                <div className="flex-1 w-full bg-rose-50 border border-rose-400 rounded-lg py-2 px-1 text-center shadow-sm">
                  <span className="font-bold text-rose-800 text-sm print:text-black block">外線施工</span>
                  <span className="text-[10px] text-rose-600 print:text-gray-600 block leading-tight">(建築路損施工前)</span>
                </div>

              </div>
            </div>

            <div className="bg-white p-4 rounded-lg border border-purple-100 text-purple-800 font-medium print:border-gray-200 print:text-gray-700 text-sm shadow-inner">
              <strong className="text-rose-600 print:text-black">📌 圖面補充重點：</strong>
              <p className="mt-1 leading-relaxed">
                依據圖面指示，當台電「安檢」過後進入「設計」階段，後續即會進行核費與繳費作業。建商務必於「建築路損施工前」配合台電完成外線施工。
              </p>
            </div>
          </section>

          {/* 伍、繳費單與路證規費說明 (更新內容與排版) */}
          <section className="bg-rose-50 rounded-2xl shadow-sm border border-rose-100 border-l-4 border-l-rose-400 p-6 print:bg-white print:shadow-none print:border-gray-300 print:border-l-4 print:break-inside-avoid">
            <h4 className="font-bold text-rose-900 flex items-center text-lg mb-4 print:text-gray-800"><FileTextIcon className="w-5 h-5 mr-2 text-rose-600 print:text-gray-600" /> 伍、費用繳納與路證規費說明</h4>
            
            <div className="space-y-4 text-rose-800 print:text-gray-700 font-medium text-sm md:text-base">
              <div className="flex items-start">
                <div className="bg-rose-200 text-rose-800 rounded-full w-6 h-6 flex items-center justify-center font-bold mr-3 flex-shrink-0 text-sm print:border print:border-gray-400 print:bg-transparent">1</div>
                <p><strong>線路設置費繳納：</strong>當台電出具『線路設置費』繳款單(俗稱外線規費)時，建商須 <strong className="text-rose-600 print:text-black">繳納完線路設置費後</strong>，台電才會進行後續之外線發包施工程序。</p>
              </div>
              <div className="flex items-start">
                <div className="bg-rose-200 text-rose-800 rounded-full w-6 h-6 flex items-center justify-center font-bold mr-3 flex-shrink-0 text-sm print:border print:border-gray-400 print:bg-transparent">2</div>
                <p><strong>繳費單期限：</strong>繳費單核發後，有其繳費期限，<strong className="text-rose-600 print:text-black">超過即失效需重啟開單</strong>，請務必於期限內完成繳納。</p>
              </div>
              <div className="flex items-start">
                <div className="bg-rose-200 text-rose-800 rounded-full w-6 h-6 flex items-center justify-center font-bold mr-3 flex-shrink-0 text-sm print:border print:border-gray-400 print:bg-transparent">3</div>
                <p><strong>路證規費與代辦：</strong>另有『路證規費』，若路權單位為 <strong className="text-rose-600 print:text-black">台中市政府</strong>，則有其繳費期限，逾期未繳失效退件；若路權單位為 <strong className="text-rose-600 print:text-black">區公所</strong>，則無期限。此筆費用一般由台電之外線承包商代為向路權單位請照及繳費，建商再將款項給付給承包商。</p>

        <p className="text-xs text-gray-400 mt-6 pt-4 text-right border-t border-gray-200 print:mt-4 print:border-t-0">
          * 備註：本頁面為依據原廠 PDF 及相關圖面進行之重點摘要整理，僅供快速查閱與試算對照，詳細規範以台電官方公告為準。
        </p>

    // --- 預設數據對象 ---
    const DEFAULT_DATA = {
      lightCount: 0,
      lowVoltCap: 0,
      highVoltCap: 0,
      ehvType: '69',
      ehvCap: 0,
      lineSpec: 'lowHighUnderground',
      excessLength: 0
    };

    // --- 暫存資料讀取設定 ---
    // 修正重點：重新開啟原 HTML 時，優先讀取瀏覽器暫存資料，再讀取導出檔內嵌資料。
    const STORAGE_KEY = 'taipower_line_fee_temp_v2';
    const LEGACY_STORAGE_KEY = 'taipower_data';

    const normalizeSavedData = (rawData) => {
      if (!rawData) return [];
      const parsed = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
      const data = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.landNumbers) ? parsed.landNumbers : []);
      return data.map(item => ({
        name: item && item.name ? String(item.name) : '未命名地號',
        data: { ...DEFAULT_DATA, ...((item && item.data) || {}) }
      }));
    };

    const loadSavedLandNumbers = () => {
      const readLocalStorage = (key) => {
        try {
          const value = localStorage.getItem(key);
          if (value === null) return undefined;
          return normalizeSavedData(value);
        } catch (e) {
          console.warn(`無法讀取 ${key}:`, e);
          return undefined;
        }
      };

      // 1. 優先讀取「儲存數據(暫存)」寫入的瀏覽器資料。
      const currentTempData = readLocalStorage(STORAGE_KEY);
      if (currentTempData !== undefined) return currentTempData;

      // 2. 相容舊版暫存鍵，避免原本已存資料遺失。
      const legacyTempData = readLocalStorage(LEGACY_STORAGE_KEY);
      if (legacyTempData !== undefined) return legacyTempData;

      // 3. 最後才讀取導出 HTML 內嵌資料。
      try {
        const scriptData = document.getElementById('saved-data');
        if (scriptData && scriptData.textContent) {
          return normalizeSavedData(scriptData.textContent);
        }
      } catch (e) {
        console.warn('無法解析導出檔內嵌資料:', e);
      }

      return [];
    };

    const INITIAL_LAND_NUMBERS = loadSavedLandNumbers();

    // --- 費率表 ---
    const RATES = {
      capacity: {
        light: 5500,
        low: 2750,
        high: 2200,
        ehv: { '69': 2000, '161': 1313, '345': 525 }
      },
      length: {
        'lowHighOverhead': { label: '低壓或高壓 - 架空線路', price: 159 },
        'lowHighUnderground': { label: '低壓或高壓 - 地下管線', price: 799 },
        'ehv69Overhead': { label: '特高壓 69kV - 架空線路', price: 1302 },
        'ehv161Overhead': { label: '特高壓 161kV - 架空線路', price: 2549 },
        'ehv345Overhead': { label: '特高壓 345kV - 架空線路', price: 4918 },
        'ehv69Underground': { label: '特高壓 69kV - 地下管線', price: 17283 },
        'ehv161Underground': { label: '特高壓 161kV - 地下管線', price: 25557 },
        'ehv345Underground': { label: '特高壓 345kV - 地下管線', price: 115589 },
      }
    };

    function App() {
      // --- 狀態管理：加入讀取存檔的機制 ---
      // 重新開啟原檔時會先讀取「儲存數據(暫存)」的資料，並自動選取第一筆地號顯示。
      const [landNumbers, setLandNumbers] = useState(() => INITIAL_LAND_NUMBERS);
      
      const [landInput, setLandInput] = useState("");
      const [activeLandIndex, setActiveLandIndex] = useState(() => INITIAL_LAND_NUMBERS.length > 0 ? 0 : null);
      const [editingIndex, setEditingIndex] = useState(null);
      const [editValue, setEditValue] = useState("");
      const [currentTime, setCurrentTime] = useState(new Date());
      const [isEditMode, setIsEditMode] = useState(false);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");
      const [passwordError, setPasswordError] = useState("");
      const [currentView, setCurrentView] = useState('calculator');

      const [results, setResults] = useState({
        capacityFee: 0, lengthFee: 0, totalWithTax: 0, totalWithoutTax: 0
      });

      // --- 時間更新邏輯 ---
      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTime(new Date());
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // --- 計算邏輯 ---
      useEffect(() => {
        if (activeLandIndex === null || !landNumbers[activeLandIndex]) {
          setResults({ capacityFee: 0, lengthFee: 0, totalWithTax: 0, totalWithoutTax: 0 });
          return;
        }

        const data = landNumbers[activeLandIndex].data;
        const cLight = (parseFloat(data.lightCount) || 0) * RATES.capacity.light;
        const cLow = (parseFloat(data.lowVoltCap) || 0) * RATES.capacity.low;
        const cHigh = (parseFloat(data.highVoltCap) || 0) * RATES.capacity.high;
        const cEhv = (parseFloat(data.ehvCap) || 0) * RATES.capacity.ehv[data.ehvType];
        const totalCapacity = cLight + cLow + cHigh + cEhv;

        const lengthPrice = RATES.length[data.lineSpec].price;
        const totalLength = (parseFloat(data.excessLength) || 0) * lengthPrice;

        const total = totalCapacity + totalLength;

        setResults({
          capacityFee: totalCapacity,
          lengthFee: totalLength,
          totalWithTax: total,
          totalWithoutTax: Math.round(total / 1.05) 
        });
      }, [landNumbers, activeLandIndex]);

      const formatMoney = (amount) => {
        return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(amount);
      };

      // --- 地號操作 ---
      const handleAddLand = () => {
        if (!landInput.trim()) return;
        const newLand = {
          name: landInput.trim(),
          data: { ...DEFAULT_DATA }
        };
        const newList = [...landNumbers, newLand];
        setLandNumbers(newList);
        setLandInput("");
        if (activeLandIndex === null) setActiveLandIndex(newList.length - 1);
        setCurrentView('calculator'); // 新增地號時自動切回計算機
      };

      const handleUpdateData = (field, value) => {
        if (activeLandIndex === null) return;
        const newList = [...landNumbers];
        newList[activeLandIndex].data[field] = value;
        setLandNumbers(newList);
      };

      const handleStartEdit = (e, index) => {
        e.stopPropagation(); 
        setEditingIndex(index);
        setEditValue(landNumbers[index].name);
      };

      const handleSaveEdit = (e) => {
        e.stopPropagation();
        if (!editValue.trim()) return;
        const newList = [...landNumbers];
        newList[editingIndex].name = editValue.trim();
        setLandNumbers(newList);
        setEditingIndex(null);
      };

      const handleDeleteLand = (e, index) => {
        e.stopPropagation();
        const newList = landNumbers.filter((_, i) => i !== index);
        setLandNumbers(newList);
        if (activeLandIndex === index) {
          setActiveLandIndex(newList.length > 0 ? 0 : null);
        } else if (activeLandIndex > index) {
          setActiveLandIndex(activeLandIndex - 1);
        }
      };

      const formatDateTime = (date) => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        const hh = String(date.getHours()).padStart(2, '0');
        const mm = String(date.getMinutes()).padStart(2, '0');
        const ss = String(date.getSeconds()).padStart(2, '0');
        return `${y}/${m}/${d} ${hh}:${mm}:${ss}`;
      };

      // --- 編輯模式密碼邏輯 ---
      const handleToggleEditMode = () => {
        if (isEditMode) {
          // 若目前為編輯模式，直接關閉並退出編輯狀態
          setIsEditMode(false);
          setEditingIndex(null);
        } else {
          // 若為檢閱模式，開啟密碼彈窗
          setShowPasswordModal(true);
          setPasswordInput("");
          setPasswordError("");
        }
      };

      const handlePasswordSubmit = () => {
        if (passwordInput === '123456') {
          setIsEditMode(true);
          setShowPasswordModal(false);
        } else {
          setPasswordError("密碼錯誤，請重新輸入");
        }
      };

      // --- 下載(導出)為 HTML 檔案邏輯 ---
      const handleDownloadHtml = () => {
        // 複製當前的 HTML 節點，以保持原檔案結構
        const htmlNode = document.documentElement.cloneNode(true);
        
        // 將 React 掛載點清空，這樣下次打開檔案時，React 才會重新正確掛載
        const rootNode = htmlNode.querySelector('#root');
        if (rootNode) {
          rootNode.innerHTML = '';
        }

        // 尋找或建立用來存放數據的 script 標籤
        let dataScript = htmlNode.querySelector('#saved-data');
        if (!dataScript) {
          dataScript = document.createElement('script');
          dataScript.id = 'saved-data';
          dataScript.type = 'application/json';
          htmlNode.querySelector('head').appendChild(dataScript);
        }
        
        // 將當前的專案資料寫入 script 內 (替換 < 符號以避免解析錯誤)
        dataScript.textContent = JSON.stringify(landNumbers).replace(/</g, '\\u003c');

        // 加上 DOCTYPE 並建立 Blob
        const htmlContent = "<!DOCTYPE html>\n" + htmlNode.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        
        // 產生檔案下載動作
        const link = document.createElement('a');
        link.href = url;
        const d = new Date();
        const timeStr = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
        link.download = `台電線路費用計算機_${timeStr}.html`;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      // --- 儲存(暫存)至 LocalStorage 邏輯 ---
      const handleTempSave = () => {
        try {
          const savePayload = {
            savedAt: new Date().toISOString(),
            landNumbers: landNumbers
          };

          // 寫入新版 key，並同步寫入舊版 key 以相容原本檔案。
          localStorage.setItem(STORAGE_KEY, JSON.stringify(savePayload));
          localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(landNumbers));
          alert('數據已成功暫存至您的瀏覽器！下次重新開啟此原檔時，會優先讀取暫存資料並自動顯示。');
        } catch(e) {
          console.error('暫存失敗:', e);
          alert('暫存失敗，可能遇到瀏覽器限制、無痕模式或本機檔案權限限制。');
        }
      };

      // --- 列印處理邏輯 ---
      const handlePrint = () => {
        window.print();
      };

      // 若刪除/載入資料後目前索引失效，自動調整到可用資料。
      useEffect(() => {
        if (landNumbers.length === 0 && activeLandIndex !== null) {
          setActiveLandIndex(null);
        } else if (landNumbers.length > 0 && (activeLandIndex === null || !landNumbers[activeLandIndex])) {
          setActiveLandIndex(0);
        }
      }, [landNumbers, activeLandIndex]);

      // 當前正在查看的數據
      const currentData = activeLandIndex !== null && landNumbers[activeLandIndex] ? landNumbers[activeLandIndex].data : null;

      return (
        <div className="min-h-screen bg-gray-50 p-4 md:p-8 font-sans text-gray-800 print:p-0 print:bg-white relative">
          {/* 密碼驗證彈窗 */}
          {showPasswordModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 animate-fadeIn print:hidden">
              <div className="bg-white rounded-2xl p-8 shadow-2xl w-96 max-w-[90%]">
                <h3 className="text-xl font-bold mb-2 text-gray-800">啟用編輯模式</h3>
                <p className="text-sm text-gray-500 mb-6">請輸入管理員密碼以解鎖內容編輯權限。</p>
                <input
                  type="password"
                  className="w-full px-4 py-3 border border-gray-300 rounded-xl mb-2 focus:ring-2 focus:ring-blue-500 outline-none transition font-mono"
                  placeholder="請輸入密碼..."
                  value={passwordInput}
                  onChange={(e) => setPasswordInput(e.target.value)}
                  onKeyPress={(e) => e.key === 'Enter' && handlePasswordSubmit()}
                  autoFocus
                />
                {passwordError && <p className="text-red-500 text-sm mb-2 font-bold">{passwordError}</p>}
                <div className="flex justify-end space-x-3 mt-6">
                  <button onClick={() => setShowPasswordModal(false)} className="px-5 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-bold transition">取消</button>
                  <button onClick={handlePasswordSubmit} className="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold transition">確認解鎖</button>
                </div>
              </div>
            </div>
          )}

          <div className="max-w-5xl mx-auto">
            
            {/* 功能列：實時時間顯示、工具按鈕與編輯模式按鈕 */}
            <div className="flex justify-between items-center mb-4 print:hidden">
              <div className="font-mono text-lg md:text-xl font-bold text-gray-700 tracking-wider">
                {formatDateTime(currentTime)}
              </div>
              
              <div className="flex items-center space-x-4">
                {/* 編輯模式工具列：僅在編輯模式下顯示 */}
                {isEditMode && (
                  <div className="flex items-center space-x-2 mr-4 border-r border-gray-300 pr-4 animate-fadeIn">
                    <button 
                      onClick={handleTempSave}
                      className="flex items-center px-3 py-1.5 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition text-sm font-medium"
                      title="儲存數據(暫存)"
                    >
                      <SaveIcon className="mr-1.5" size={16} /> 儲存數據(暫存)
                    </button>
                    <button 
                      onClick={handlePrint}
                      className="flex items-center px-3 py-1.5 bg-gray-100 text-gray-700 rounded hover:bg-gray-200 transition text-sm font-medium"
                      title="列印/另存PDF檔"
                    >
                      <PrinterIcon className="mr-1.5" size={16} /> 列印/另存PDF檔
                    </button>
                    <button 
                      onClick={handleDownloadHtml}
                      className="flex items-center px-3 py-1.5 bg-green-100 text-green-700 rounded hover:bg-green-200 transition text-sm font-medium"
                      title="導出檔案"
                    >
                      <DownloadIcon className="mr-1.5" size={16} /> 導出檔案
                    </button>
                  </div>
                )}

                {/* 編輯模式切換 */}
                <div 
                  className="flex items-center space-x-2 cursor-pointer select-none" 
                  onClick={handleToggleEditMode}
                >
                  <div className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${isEditMode ? 'bg-green-500' : 'bg-gray-300'}`}>
                    <span className={`inline-block h-4 w-4 transform rounded-full bg-white shadow-sm transition-transform ${isEditMode ? 'translate-x-6' : 'translate-x-1'}`} />
                  </div>
                  <span className={`font-bold ${isEditMode ? 'text-green-600' : 'text-gray-500'}`}>
                    {isEditMode ? '編輯模式' : '檢閱模式'}
                  </span>
                </div>
              </div>
            </div>

            {/* Header */}
            <header className="bg-blue-600 text-white rounded-2xl p-6 shadow-lg mb-6 print:shadow-none print:border print:border-gray-300">
              <div className="flex items-center space-x-4">
                <div className="bg-white/20 p-3 rounded-full print:border print:border-gray-200">
                  <ZapIcon className="text-yellow-300" />
                </div>
                <div>
                  <h1 className="text-2xl md:text-3xl font-bold">台電線路設置費用計算機</h1>
                  <p className="text-blue-100 mt-1 text-sm md:text-base">依據 111年5月30日實施 之收費費率表製作 (內含5%營業稅)</p>
                </div>
              </div>
            </header>

            {/* 專案資訊區塊 - 列印時隱藏此區塊，因為下面會有「當前編輯提醒」顯示案名 */}
            <section className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6 print:hidden">
              <h2 className="text-xl font-bold text-gray-800 flex items-center mb-6 border-b pb-3">
                <MapPinIcon className="mr-2 text-red-500" size={24} />
                專案地號管理
              </h2>
              
              <div className="flex flex-col md:flex-row gap-3 mb-6">
                <input 
                  type="text" 
                  className="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none disabled:bg-gray-100 disabled:cursor-not-allowed"
                  placeholder={isEditMode ? "請輸入案名或地號並點擊新增" : "目前為檢閱模式，無法新增地號"}
                  value={landInput}
                  onChange={(e) => setLandInput(e.target.value)}
                  onKeyPress={(e) => e.key === 'Enter' && handleAddLand()}
                  disabled={!isEditMode}
                />
                <button 
                  onClick={handleAddLand}
                  disabled={!isEditMode}
                  className={`text-white px-6 py-2 rounded-lg font-medium transition flex items-center justify-center shadow-md ${isEditMode ? 'bg-red-500 hover:bg-red-600 active:scale-95' : 'bg-gray-400 cursor-not-allowed opacity-70'}`}
                >
                  <PlusIcon className="mr-2" /> 新增地號
                </button>
              </div>

              {/* 將此處的 Grid 格子做縮小排版 */}
              {landNumbers.length > 0 ? (
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 md:gap-3">
                  {landNumbers.map((land, index) => (
                    <div 
                      key={index} 
                      onClick={() => { setActiveLandIndex(index); setCurrentView('calculator'); }}
                      className={`cursor-pointer flex items-center justify-between px-3 py-2 rounded-lg border transition-all shadow-sm group ${
                        activeLandIndex === index 
                          ? 'border-blue-500 bg-blue-50 ring-2 ring-blue-200' 
                          : 'border-gray-200 bg-gray-50 hover:bg-white hover:border-blue-300'
                      }`}
                    >
                      {editingIndex === index ? (
                        <div className="flex items-center w-full gap-2">
                          <input 
                            className="flex-1 px-2 py-1 text-sm border border-blue-400 rounded outline-none bg-white"
                            value={editValue}
                            onChange={(e) => setEditValue(e.target.value)}
                            autoFocus
                            onClick={(e) => e.stopPropagation()}
                          />
                          <button onClick={handleSaveEdit} className="text-green-600 p-1 hover:bg-green-100 rounded flex-shrink-0"><CheckIcon size={16} /></button>
                        </div>
                      ) : (
                        <React.Fragment>
                          <div className="flex items-center space-x-2 overflow-hidden">
                            <div className={`w-2 h-2 rounded-full flex-shrink-0 ${activeLandIndex === index ? 'bg-blue-500 animate-pulse' : 'bg-gray-300'}`}></div>
                            <span className={`font-bold truncate text-sm ${activeLandIndex === index ? 'text-blue-700' : 'text-gray-600'}`}>
                              {land.name}
                            </span>
                          </div>
                          {isEditMode && (
                            <div className="flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition ml-2 flex-shrink-0">
                              <button onClick={(e) => handleStartEdit(e, index)} className="text-blue-500 p-1 hover:bg-blue-100 rounded"><EditIcon size={14} /></button>
                              <button onClick={(e) => handleDeleteLand(e, index)} className="text-red-500 p-1 hover:bg-red-100 rounded"><TrashIcon size={14} /></button>
                            </div>
                          )}
                        </React.Fragment>
                      )}
                    </div>
                  ))}
                </div>
              ) : (
                <div className="text-center py-8 border-2 border-dashed border-gray-100 rounded-2xl text-gray-400 mb-2">
                  <MapPinIcon className="mx-auto mb-2 opacity-20" size={40} />
                  <span className="text-sm">請先啟用編輯模式並新增地號，才能進行費用計算</span>
                </div>
              )}
            </section>

            {/* 頁籤切換 (橘框處) - 列印時隱藏 */}
            <div className="flex space-x-3 mb-6 print:hidden">
              <button
                onClick={() => setCurrentView('calculator')}
                className={`flex items-center px-6 py-3 rounded-xl font-bold transition-all shadow-sm ${currentView === 'calculator' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}`}
              >
                <CalculatorIcon className="mr-2" size={20} />
                費用計算機
              </button>
              <button
                onClick={() => setCurrentView('reference')}
                className={`flex items-center px-6 py-3 rounded-xl font-bold transition-all shadow-sm ${currentView === 'reference' ? 'bg-purple-600 text-white' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}`}
              >
                <BookIcon className="mr-2" size={20} />
                附件：參考資料 (說明頁面)
              </button>
            </div>

            {/* 區塊 1: 計算機主體 */}
            <div className={`${currentView === 'calculator' ? 'block animate-fadeIn' : 'hidden print:block'}`}>
              {currentData && (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 print:block">
                  <div className="lg:col-span-2 space-y-6 print:w-full print:mb-6">
                    {/* 當前編輯提醒 */}
                    <div className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm flex items-center shadow-sm print:bg-gray-100 print:text-gray-800 print:border print:border-gray-300 print:shadow-none">
                      <InfoIcon size={16} className="mr-2 print:text-gray-600" />
                      當前報表專案：<strong className="ml-1 underline font-bold text-lg">{landNumbers[activeLandIndex].name}</strong>
                    </div>

                    {/* Section 1 */}
                    <section className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 print:shadow-none print:border-gray-300 print:break-inside-avoid">
                      <h2 className="text-xl font-bold text-gray-800 flex items-center mb-6 border-b pb-3">
                        <FileTextIcon className="mr-2 text-blue-500 print:text-gray-600" size={24} />
                        表一：供電容量設置費
                      </h2>
                      
                      <div className="space-y-5">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-2">
                          <div className="flex-1">
                            <label className="font-semibold text-gray-700 block">電燈 (表燈用電)</label>
                            <span className="text-sm text-gray-500">每戶 5,500 元</span>
                          </div>
                          <div className="flex items-center space-x-2">
                            <input type="number" min="0" className="w-32 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none disabled:bg-gray-100 disabled:text-gray-800 disabled:cursor-not-allowed print:bg-white print:border-none print:text-right print:p-0" value={currentData.lightCount} onChange={(e) => handleUpdateData('lightCount', e.target.value)} disabled={!isEditMode} />
                            <span className="text-gray-600 font-medium w-8">戶</span>
                          </div>
                        </div>

                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-2 bg-blue-50/50 p-3 -mx-3 rounded-xl border border-blue-50 print:bg-white print:border-none print:m-0 print:p-0">
                          <div className="flex-1">
                            <label className="font-semibold text-gray-700 block">低壓電力</label>
                            <span className="text-sm text-gray-500">每瓩 2,750 元</span>
                          </div>
                          <div className="flex items-center space-x-2 mt-2 md:mt-0">
                            <input type="number" min="0" className="w-32 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none disabled:bg-gray-100 disabled:text-gray-800 disabled:cursor-not-allowed print:bg-white print:border-none print:text-right print:p-0" value={currentData.lowVoltCap} onChange={(e) => handleUpdateData('lowVoltCap', e.target.value)} disabled={!isEditMode} />
                            <span className="text-gray-600 font-medium w-8">瓩/HP</span>
                          </div>
                        </div>

                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-2">
                          <div className="flex-1">
                            <label className="font-semibold text-gray-700 block">高壓電力</label>
                            <span className="text-sm text-gray-500">每瓩 2,200 元</span>
                          </div>
                          <div className="flex items-center space-x-2">
                            <input type="number" min="0" className="w-32 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none disabled:bg-gray-100 disabled:text-gray-800 disabled:cursor-not-allowed print:bg-white print:border-none print:text-right print:p-0" value={currentData.highVoltCap} onChange={(e) => handleUpdateData('highVoltCap', e.target.value)} disabled={!isEditMode} />
                            <span className="text-gray-600 font-medium w-8">瓩</span>
                          </div>
                        </div>

                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-2 border-t pt-4 print:border-gray-200">
                          <div className="flex-1">
                            <label className="font-semibold text-gray-700 block mb-2 print:mb-0">特高壓電力</label>
                            <select className="w-full md:w-48 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:text-gray-800 disabled:cursor-not-allowed bg-white print:border-none print:bg-white print:p-0 print:appearance-none" value={currentData.ehvType} onChange={(e) => handleUpdateData('ehvType', e.target.value)} disabled={!isEditMode}>
                              <option value="69">69千伏 (2,000元/瓩)</option>
                              <option value="161">161千伏 (1,313元/瓩)</option>
                              <option value="345">345千伏 (525元/瓩)</option>
                            </select>
                          </div>
                          <div className="flex items-center space-x-2 mt-2 md:mt-0">
                            <input type="number" min="0" className="w-32 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none disabled:bg-gray-100 disabled:text-gray-800 disabled:cursor-not-allowed print:bg-white print:border-none print:text-right print:p-0" value={currentData.ehvCap} onChange={(e) => handleUpdateData('ehvCap', e.target.value)} disabled={!isEditMode} />
                            <span className="text-gray-600 font-medium w-8">瓩</span>
                          </div>
                        </div>
                      </div>
                    </section>

                    {/* Section 2 */}
                    <section className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 print:shadow-none print:border-gray-300 print:break-inside-avoid">
                      <h2 className="text-xl font-bold text-gray-800 flex items-center mb-6 border-b pb-3">
                        <CalculatorIcon className="mr-2 text-green-500 print:text-gray-600" size={24} />
                        表二：新建長度設置費 (超長費)
                      </h2>
                      
                      <div className="space-y-5">
                        <div className="flex flex-col md:flex-row gap-4">
                          <div className="flex-1">
                            <label className="font-semibold text-gray-700 block mb-2 print:mb-0">供電方式與管線種類</label>
                            <select className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 disabled:bg-gray-100 disabled:text-gray-800 disabled:cursor-not-allowed bg-white print:border-none print:bg-white print:p-0 print:appearance-none" value={currentData.lineSpec} onChange={(e) => handleUpdateData('lineSpec', e.target.value)} disabled={!isEditMode}>
                              {Object.entries(RATES.length).map(([key, data]) => (
                                <option key={key} value={key}>{data.label} ({data.price}元/公尺)</option>
                              ))}
                            </select>
                          </div>
                          
                          <div className="w-full md:w-1/3">
                            <label className="font-semibold text-gray-700 block mb-2 print:mb-0">超出長度</label>
                            <div className="flex items-center space-x-2">
                              <input type="number" min="0" className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none disabled:bg-gray-100 disabled:text-gray-800 disabled:cursor-not-allowed print:bg-white print:border-none print:text-right print:p-0" value={currentData.excessLength} onChange={(e) => handleUpdateData('excessLength', e.target.value)} disabled={!isEditMode} />
                              <span className="text-gray-600 font-medium whitespace-nowrap">公尺</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </section>
                  </div>

                  {/* Right Column (Sticky Results) */}
                  <div className="lg:col-span-1 print:w-full print:mt-6 print:break-inside-avoid">
                    <div className="sticky top-6 bg-gray-800 text-white rounded-2xl shadow-xl overflow-hidden print:static print:bg-white print:text-gray-900 print:shadow-none print:border print:border-gray-300">
                      <div className="p-6 border-b border-gray-700 print:border-gray-300">
                        <h3 className="text-lg font-medium text-gray-300 mb-4 flex items-center print:text-gray-800 print:font-bold">
                           計算結果：{landNumbers[activeLandIndex].name}
                        </h3>
                        
                        <div className="space-y-4">
                          <div className="flex justify-between items-center">
                            <span className="text-gray-400 print:text-gray-600">供電容量設置費</span>
                            <span className="font-mono text-lg print:font-bold">{formatMoney(results.capacityFee)}</span>
                          </div>
                          <div className="flex justify-between items-center">
                            <span className="text-gray-400 print:text-gray-600">新建長度超長費</span>
                            <span className="font-mono text-lg print:font-bold">{formatMoney(results.lengthFee)}</span>
                          </div>
                        </div>
                      </div>

                      <div className="p-6 bg-gray-900 print:bg-white print:border-b print:border-gray-300">
                        <div className="mb-2">
                          <p className="text-gray-400 text-sm mb-1 print:text-gray-600">應繳總金額 (含稅)</p>
                          <div className="text-3xl md:text-4xl font-bold text-yellow-400 tracking-tight text-right break-words print:text-black">
                            {formatMoney(results.totalWithTax)}
                          </div>
                        </div>
                        
                        <div className="mt-6 pt-4 border-t border-gray-800 flex justify-between items-center text-sm print:border-gray-200">
                          <span className="text-gray-500 print:text-gray-600">免計稅用戶金額</span>
                          <span className="text-gray-300 font-mono print:text-gray-800 print:font-bold">{formatMoney(results.totalWithoutTax)}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* 區塊 2: 專屬說明頁面 (參考資料) */}
            <div className={`${currentView === 'reference' ? 'block animate-fadeIn' : 'hidden print:block print:mt-8'}`}>
              <ReferenceAttachment />
            </div>

          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.4s ease-out forwards;
    }
    
    /* 列印專屬排版優化 */
    @media print {
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        background-color: white !important;
        margin: 0;
        padding: 0;
      }
      /* 隱藏網頁預設捲軸避免影響列印版面 */
      ::-webkit-scrollbar {
        display: none;
      }
    }
  </style>
</body>
</html>
